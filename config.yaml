# 市场主线切换盘后看板 - 全局配置
# 所有阈值、信源、路径均在此调整，无需改代码。

baseline_index: "000300"          # 基准指数：沪深300
run_time: "18:00"
timezone: "Asia/Shanghai"

# 催化计数窗口（交易日）
catalyst_window_days: 5
# 新闻/研报展示回溯天数（自然日）
news_lookback_days: 7
# 看板每个区块最多展示条数
display_max_policy: 3
display_max_research: 3

thresholds:
  rs_trend_days: 4                # RS 连续上升/下降天数；回测滚动样本外 3/3 折为正
  volume_ratio_strong: 1.5
  volume_ratio_weak: 0.8
  breadth_strong: 0.8             # 强化宽度门槛；回测各折均选中 0.8
  breadth_weak: 0.4
  leaders_below_ma20_min: 2       # 走弱时至少多少只龙头跌破20日线
  confirm_days: 2                 # 切换确认所需连续天数（含当日）
  crowded_5d_return: 0.15
  crowded_volume_ratio: 2.0
  crowded_leader_5d_return: 0.20  # 龙头5日涨幅“过热”阈值
  crowded_leader_ratio: 0.6       # 达到该比例的龙头过热即判拥挤

# 本地参考数据：仅用于回测（run_backtest.py），不参与每日流水线。
# 目录不可用时自动关闭本地增强，回测退回纯远程行情口径。
local_data:
  enabled: true
  breakout_dir: "D:/trae-project/breakout_v3"
  ice_rebound_dir: "D:/trae-project/ice-rebound"
  # 回测载体覆盖：生产仍使用 themes.yaml 的指数，这里仅在回测中换用更长历史的代理。
  carrier_overrides:
    semiconductor: {type: etf, code: "588200"}   # 科创芯片ETF，2022-10 起，含成交额
  # 概念宽度：同花顺概念指数（breakout_v3/data_ths_index），未映射或概念数<3 的主线回退龙头宽度。
  concept_map:
    ai_compute: ["东数西算(算力)", "共封装光学(CPO)", "数据中心(AIDC)", "算力租赁", "液冷服务器"]
    semiconductor: ["芯片概念", "第三代半导体", "汽车芯片", "MCU芯片", "存储芯片"]

limit_up:
  enable_as_aux: false            # 涨停数据仅作强化/走弱参考，默认不参与判定
  min_count_per_day: 3
  consecutive_days: 2

sources:
  policy: [gov_cn, pboc, csrc, stats]
  research: [eastmoney_report]
  news: [wallstreetcn]
  market_api: [tencent_index, sina_stock, sina_global, eastmoney_bond]
  limit_up: [eastmoney_limitup]

themes_file: "themes.yaml"
holdings_file: "holdings.yaml"

# D 区块持仓备注：优先读取 breakout_v3 的 daily 目录（纯展示，不参与主线计算）。
# 目录不存在时回退到 holdings_file 配置的本地持仓。
breakout:
  daily_dir: "D:/trae-project/breakout_v3/daily"

output:
  sqlite_path: "data/market.db"
  dashboard_port: 8501
  email_enabled: false            # 第一版不实现邮件推送

# GitHub Pages 静态看板导出（publish.py）
publish:
  output_dir: "docs"
  include_holdings: true          # 仓库公开时建议改为 false，避免持仓信息外泄
  archive_limit: 180              # 最多保留多少个历史日期页面
  auto_refresh_seconds: 600       # 最新页自动重载间隔（秒），0 表示关闭
  site_title: "市场主线切换盘后看板"

# AI 仅用于一句话摘要与情绪分类，不预测涨跌。默认关闭，关闭时使用规则摘要。
ai:
  enabled: false
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
  timeout: 30

logging:
  dir: "logs"
  level: "INFO"
